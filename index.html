function updateMenuInfo() {
    for(let i=1; i<=3; i++) {
        const raw = localStorage.getItem('ddnet_slot_'+i);
        const name = localStorage.getItem('ddnet_name_'+i);
        document.getElementById('title-'+i).innerText = name || "Карта " + i;
        document.getElementById('info-'+i).innerText = raw ? 'Блоков: ' + JSON.parse(raw).length : 'Пусто';
    }
}
updateMenuInfo();

function renameSlot(s) {
    const n = prompt("Название:", document.getElementById('title-'+s).innerText);
    if(n) { localStorage.setItem('ddnet_name_'+s, n); updateMenuInfo(); }
}

function loadSlot(s) {

    gameActive = true;
    document.getElementById('main-menu').style.display = 'none';
    ['hud','hotbar','tee-settings'].forEach(id => document.getElementById(id).style.display = 'flex');
    spawnPoint = { x: 100, y: 100 };
    resetTee();
}

function saveMap() { 
    if(gameActive && !isTutorial) {
        localStorage.setItem('ddnet_slot_'+currentSlot, JSON.stringify(map)); 
    }
}

window.onkeydown = e => {
    if (document.activeElement.tagName === 'INPUT') return;
    if (e.code === 'KeyM') { gameActive = false; document.getElementById('main-menu').style.display = 'flex'; updateMenuInfo(); return; }
    if(keys[e.code]) return; keys[e.code] = true;
    if(e.code === 'KeyE') { editMode = !editMode; closeProps(); }
    if(e.key >= '1' && e.key <= '9') setType(parseInt(e.key));
    if(e.code === 'KeyR') resetTee();
    if(e.code === 'Space' && !editMode && !tee.frozen) {
        if(tee.grounded) { tee.vy = -phys.jump; tee.grounded = false; tee.jumps = 1; }
        else if(tee.jumps < 2 && tee.canDoubleJump) { tee.vy = -phys.dj; tee.jumps = 2; }
    }
};
window.onkeyup = e => keys[e.code] = false;

window.onmousedown = e => {
    if (!gameActive || e.target.closest('.ui-element')) return;
    const tx = Math.floor((e.clientX + camera.x) / tileSize), ty = Math.floor((e.clientY + camera.y) / tileSize);
    if (e.button === 1 || (editMode && keys['Space'])) { isPanning = true; return; }
    if(editMode) {
        if(isTutorial) return; // ЗАПРЕТ РЕДАКТИРОВАНИЯ
        const found = map.find(t => t.x === tx && t.y === ty);
        if (e.button === 0) {
            if (found) { openProps(found); return; }
            isDrawing = true; addBlock(tx, ty);
        } else if (e.button === 2) { isRemoving = true; removeBlock(tx, ty); }
    } else if (e.button === 2) castHook();
};

window.onmouseup = e => {
    isDrawing = false; isRemoving = false; isPanning = false;
    if (e.button === 2 && !editMode) tee.hook.active = false;
};

function castHook() {
    const sX = tee.x + TEE_W/2, sY = tee.y + TEE_H/2;
    const angle = Math.atan2(mouse.y + camera.y - sY, mouse.x + camera.x - sX);
    for(let d=0; d<500; d+=4) {
        const cx = sX + Math.cos(angle)*d, cy = sY + Math.sin(angle)*d;
        const b = map.find(t => t.x === Math.floor(cx/tileSize) && t.y === Math.floor(cy/tileSize));
        if(b) {
            if(b.type === 1) { tee.hook.active = true; tee.hook.x = cx; tee.hook.y = cy; return; }
            if(b.type === 2 && !b.passHook) break;
        }
    }
}

function update() {
    if(!gameActive || editMode) { canvas.style.cursor = "default"; return; }
    canvas.style.cursor = "none";
    let accel = (tee.grounded && !tee.frozen) ? phys.accel : (tee.frozen ? 0 : phys.airAccel);
    if(!tee.frozen) {
        if(keys['KeyA']) { tee.vx -= accel; tee.walkCycle += 0.2; }
        if(keys['KeyD']) { tee.vx += accel; tee.walkCycle += 0.2; }
    }
    tee.vx *= tee.grounded ? phys.groundFric : phys.airFric;
    tee.vy += phys.grav;
    if(tee.hook.active) {
        const dx = tee.hook.x - (tee.x + TEE_W/2), dy = tee.hook.y - (tee.y + TEE_H/2), d = Math.sqrt(dx*dx + dy*dy);
        tee.vx += (dx/d) * phys.hookPull; tee.vy += (dy/d) * phys.hookPull;
    }
    tee.x += tee.vx; checkColl(true);
    tee.y += tee.vy; checkColl(false);
    camera.x += (tee.x - width/2 + TEE_W/2 - camera.x) * 0.1;
    camera.y += (tee.y - height/2 + TEE_H/2 - camera.y) * 0.1;
}

function checkColl(horiz) {
    if(!horiz) tee.grounded = false;
    for(let t of map) {
        const tx = t.x * tileSize, ty = t.y * tileSize;
        if(tee.x < tx + tileSize && tee.x + TEE_W > tx && tee.y < ty + tileSize && tee.y + TEE_H > ty) {
            if(t.type <= 2) { 
                if(horiz) { tee.x = tee.vx > 0 ? tx - TEE_W : tx + tileSize; tee.vx = 0; }
                else {
                    if(tee.vy > 0) { tee.y = ty - TEE_H; tee.grounded = true; tee.jumps = 0; tee.frozen = false; }
                    else { tee.y = ty + tileSize; }
                    tee.vy = 0;
                }
            } else {
                if(t.type === 3) { resetTee(); return; }
                if(t.type === 4) tee.canDoubleJump = true; 
                if(t.type === 5) tee.canDoubleJump = false; 
                if(t.type === 6) { tee.vy = -(t.power || 16); tee.jumps = 1; }
                if(t.type === 7) tee.frozen = true;
                if(t.type === 9) spawnPoint = { x: tx, y: ty - 2 };
            }
        }
    }
}

function draw() {
    ctx.fillStyle = '#111'; ctx.fillRect(0, 0, width, height);
    if(!gameActive) { requestAnimationFrame(draw); return; }
    ctx.save(); ctx.translate(-camera.x, -camera.y);
    if(editMode) {
        ctx.strokeStyle = "rgba(255,255,255,0.03)"; ctx.beginPath();
        for(let x = Math.floor(camera.x/tileSize)*tileSize; x < camera.x+width; x+=tileSize) { ctx.moveTo(x, camera.y); ctx.lineTo(x, camera.y+height); }
        for(let y = Math.floor(camera.y/tileSize)*tileSize; y < camera.y+height; y+=tileSize) { ctx.moveTo(camera.x, y); ctx.lineTo(camera.x+width, y); }
        ctx.stroke();
    }
    map.forEach(t => {
        if(t.type === 8) { 
            ctx.fillStyle= t.color || "white"; ctx.font="14px Arial"; ctx.textAlign="center"; 
            ctx.fillText(t.text||"", t.x*tileSize+tileSize/2, t.y*tileSize+tileSize/2); return; 
        }
        if(t.type > 3 && !editMode) return;
        
        ctx.globalAlpha = t.opacity !== undefined ? t.opacity : 1;
        ctx.fillStyle = t.color || defaultColors[t.type];
        ctx.fillRect(t.x * tileSize, t.y * tileSize, tileSize, tileSize);
        ctx.globalAlpha = 1;

        if(editMode) { ctx.strokeStyle = (selectedObj === t) ? "#0ff" : "rgba(255,255,255,0.1)"; ctx.strokeRect(t.x*tileSize, t.y*tileSize, tileSize, tileSize); }
    });
    const cx = tee.x + TEE_W/2, cy = tee.y + TEE_H/2, fA = Math.sin(tee.walkCycle)*10;
    ctx.fillStyle = tee.feetColor; ctx.beginPath(); ctx.arc(cx-12+fA, tee.y+TEE_H-4, 9, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+12-fA, tee.y+TEE_H-4, 9, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = tee.frozen ? '#afeeee' : tee.bodyColor; ctx.beginPath(); ctx.arc(cx, cy-4, TEE_W/2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(cx-10+tee.vx, cy-9+tee.vy*0.1, 7, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+10+tee.vx, cy-9+tee.vy*0.1, 7, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(cx-10+tee.vx*1.3, cy-9+tee.vy*0.2, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+10+tee.vx*1.3, cy-9+tee.vy*0.2, 2.5, 0, Math.PI*2); ctx.fill();
    if(tee.hook.active) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(tee.hook.x, tee.hook.y); ctx.stroke(); }
    ctx.restore();
    if(!editMode) { ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 3, 0, Math.PI*2); ctx.fill(); }
    update(); requestAnimationFrame(draw);
}

function setType(n) { selectedType = n; document.querySelectorAll('.slot').forEach((s, i) => s.classList.toggle('active', i === n-1)); }

function openProps(obj) {
    if(isTutorial) return; // ЗАПРЕТ РЕДАКТИРОВАНИЯ СВОЙСТВ
    selectedObj = obj; document.getElementById('properties').style.display = 'block';
    let h = `<b>Блок: ${obj.type}</b><br>`;
    h += `<label>Цвет:</label><input type="color" value="${obj.color || defaultColors[obj.type]}" oninput="selectedObj.color=this.value;saveMap()">`;
    if(obj.type === 2) {
        h += `<label>Прозрачность:</label><input type="number" step="0.1" min="0" max="1" value="${obj.opacity||1}" oninput="selectedObj.opacity=parseFloat(this.value);saveMap()">`;
        h += `<label>Пропуск хука:</label><input type="checkbox" ${obj.passHook?'checked':''} onchange="selectedObj.passHook=this.checked;saveMap()">`;
    } else if(obj.type === 8) {
        h += `<label>Текст:</label><input type="text" value="${obj.text||''}" oninput="selectedObj.text=this.value;saveMap()">`;
    } else {
        h += `<label>Сила/Параметр:</label><input type="number" value="${obj.power||16}" oninput="selectedObj.power=parseFloat(this.value);saveMap()">`;
    }
    document.getElementById('prop-fields').innerHTML = h;
}

function closeProps() { document.getElementById('properties').style.display = 'none'; selectedObj = null; }
function resetTee() { tee.x = spawnPoint.x; tee.y = spawnPoint.y; tee.vx = 0; tee.vy = 0; tee.jumps = 0; tee.canDoubleJump = true; tee.frozen = false; tee.hook.active = false; }

function addBlock(tx, ty) { 
    if(isTutorial) return; // ЗАПРЕТ ДОБАВЛЕНИЯ
    if (!map.some(t => t.x === tx && t.y === ty)) { 
        let newBlock = { x: tx, y: ty, type: selectedType, text: "Текст", power: 16, color: defaultColors[selectedType] };
        if(selectedType === 2) { newBlock.opacity = 1; newBlock.passHook = false; }
        map.push(newBlock); saveMap(); 
    } 
}

function removeBlock(tx, ty) { 
    if(isTutorial) return; // ЗАПРЕТ УДАЛЕНИЯ
    const i = map.findIndex(t => t.x === tx && t.y === ty); if (i !== -1) { map.splice(i, 1); saveMap(); } 
}

window.onmousemove = e => { mouse = { x: e.clientX, y: e.clientY }; if(isPanning) { camera.x -= e.movementX; camera.y -= e.movementY; } else if(editMode) { const tx = Math.floor((e.clientX+camera.x)/tileSize), ty = Math.floor((e.clientY+camera.y)/tileSize); if(isDrawing) addBlock(tx, ty); if(isRemoving) removeBlock(tx, ty); } };
document.getElementById('bodyColor').oninput = e => tee.bodyColor = e.target.value;
document.getElementById('feetColor').oninput = e => tee.feetColor = e.target.value;
window.oncontextmenu = e => e.preventDefault();
draw();
</script>
<script>
(function() {
    // 1. Настройка нового блока
    if (typeof defaultColors !== 'undefined') defaultColors[10] = "#9b59b6";

    const hb = document.getElementById('hotbar');
    if (hb && !document.getElementById('tp-btn')) {
        const btn = document.createElement('div');
        btn.id = 'tp-btn';
        btn.className = 'slot';
        btn.style.color = '#9b59b6';
        btn.innerHTML = 'ТЕЛЕ';
        btn.onclick = () => { if(typeof setType === 'function') setType(10); };
        hb.appendChild(btn);
    }

    let tpCooldown = 0;

    // 2. Логика телепортации (ID -> Target)
    const originalStep = window.requestAnimationFrame;
    window.requestAnimationFrame = function(callback) {
        if (typeof gameActive !== 'undefined' && gameActive && !editMode) {
            if (tpCooldown > 0) tpCooldown--;
            
            const tx = Math.floor((tee.x + 21) / 40); 
            const ty = Math.floor((tee.y + 21) / 40);
            const currentBlock = map.find(b => b.x === tx && b.y === ty && b.type === 10);
            
            if (currentBlock && tpCooldown === 0) {
                // Берем цель, которая записана во второе поле (targetID)
                const targetID = parseInt(currentBlock.targetID);
                const dest = map.find(b => b.type === 10 && parseInt(b.myID) === targetID);

                if (dest) {
                    tee.x = dest.x * 40;
                    tee.y = dest.y * 40;
                    tee.vx = 0; tee.vy = 0;
                    tpCooldown = 50; 
                }
            }
        }
        return originalStep(callback);
    };

    // 3. Новые поля в меню: МОЙ ID и КУДА ТЕЛЕПОРТИРОВАТЬ
    const oldOpen = window.openProps;
    window.openProps = function(obj) {
        if (oldOpen) oldOpen(obj);
        if (obj.type === 10) {
            const fields = document.getElementById('prop-fields');
            if (fields) {
                // Добавляем два поля ввода
                fields.innerHTML += `
                    <label>ID этого телепорта:</label>
                    <input type="number" id="p-myid" value="${obj.myID || 0}">
                    <label>Куда ведет (ID цели):</label>
                    <input type="number" id="p-targetid" value="${obj.targetID || 0}">
                `;
            }
        }
    };

    // 4. ИСПРАВЛЕННОЕ СОХРАНЕНИЕ (чтобы не сбрасывалось на 16)
    window.closeProps = function() {
        if (selectedObj) {
            const myIdInput = document.getElementById('p-myid');
            const targetIdInput = document.getElementById('p-targetid');
            
            if (myIdInput && targetIdInput) {
                selectedObj.myID = parseInt(myIdInput.value);
                selectedObj.targetID = parseInt(targetIdInput.value);
                // Чтобы твой старый код не перезаписал это, убираем дефолтный power
                selectedObj.power = 0; 
            }
            
            if (typeof saveMap === 'function') saveMap();
        }
        document.getElementById('properties').style.display = 'none';
        selectedObj = null;
    };
})();
</script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
(function() {
    const peer = new Peer();
    let players = {}; 
    let connections = []; // Хост хранит список всех активных каналов связи

    const menu = document.querySelector('.menu-btns');
    if (menu) {
        const mpBox = document.createElement('div');
        mpBox.style = "margin-top:15px; background:#222; padding:15px; border-radius:12px; border:2px solid #3498db; color:white; width:280px; text-align:center;";
        mpBox.innerHTML = `
            <div style="font-weight:bold; color:#3498db; margin-bottom:10px;">МУЛЬТИПЛЕЕР (ЛОББИ)</div>
            <div id="m-id" style="font-size:10px; color:#888; margin-bottom:5px; background:#111; padding:5px; word-break:break-all;">Загрузка...</div>
            <button id="btn-copy" style="width:100%; margin-bottom:8px; cursor:pointer;">СКОПИРОВАТЬ ID</button>
            <input type="text" id="t-id" placeholder="ID ХОСТА" style="width:100%; padding:8px; margin-bottom:5px; background:#111; color:white; border:1px solid #444; box-sizing:border-box;">
            <button id="btn-join" style="width:100%; background:#2ecc71; color:white; border:none; padding:10px; cursor:pointer; font-weight:bold;">ЗАЙТИ</button>
            <div id="mp-stat" style="font-size:10px; color:#aaa; margin-top:8px;">Игроков: 1</div>
        `;
        menu.appendChild(mpBox);

        peer.on('open', id => document.getElementById('m-id').innerText = id);
        document.getElementById('btn-copy').onclick = () => {
            navigator.clipboard.writeText(document.getElementById('m-id').innerText);
            alert("ID скопирован!");
        };
        document.getElementById('btn-join').onclick = () => setup(peer.connect(document.getElementById('t-id').value), false);
    }

    peer.on('connection', conn => setup(conn, true));

    function setup(conn, isHost) {
        conn.on('open', () => {
            if (isHost) connections.push(conn);
            updatePartyCount();

            // Отправляем свои данные (идут Хосту)
            setInterval(() => {
                if(conn.open) {
                    conn.send({
                        type: 'pos',
                        id: peer.id, 
                        x: tee.x, y: tee.y, vx: tee.vx,
                        bc: document.getElementById('bodyColor').value,
                        fc: document.getElementById('feetColor').value,
                        m: isHost ? (window.map || null) : null
                    });
                }
            }, 30);
        });

        conn.on('data', data => {
            if (data.type === 'pos') {
                // 1. Обновляем данные у себя в списке отрисовки
                players[data.id] = data; 
                if (data.m) window.map = data.m;

                // 2. САМОЕ ВАЖНОЕ: Если я Хост, я пересылаю эти данные ВСЕМ КРОМЕ отправителя
                if (isHost) {
                    connections.forEach(c => {
                        if (c.open && c.peer !== data.id) {
                            c.send(data); 
                        }
                    });
                }
            }
            updatePartyCount();
        });

        conn.on('close', () => {
            if (isHost) connections = connections.filter(c => c !== conn);
            delete players[conn.peer];
            updatePartyCount();
        });
    }

    function updatePartyCount() {
        const count = Object.keys(players).length + 1;
        document.getElementById('mp-stat').innerText = "Игроков: " + count;
    }

    // Отрисовка
    function drawRemote(p) {
        ctx.save();
        ctx.translate(p.x - camera.x, p.y - camera.y);
        const w = 33, h = 33;
        ctx.fillStyle = p.fc;
        [{x: 7, y: 28}, {x: 23, y: 28}].forEach(pos => {
            ctx.beginPath(); ctx.arc(pos.x, pos.y, 8, 0, Math.PI * 2); ctx.fill();
        });
        ctx.fillStyle = p.bc;
        ctx.beginPath(); ctx.arc(w/2, h/2 - 2, w/2, 0, Math.PI * 2); ctx.fill();
        const eyeX = (p.vx || 0) * 1.5;
        ctx.fillStyle = 'white';
        ctx.beginPath(); ctx.arc(10+eyeX, 12, 6, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(24+eyeX, 12, 6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'black';
        ctx.beginPath(); ctx.arc(11+eyeX, 12, 3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(25+eyeX, 12, 3, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }

    const nativeRAF = window.requestAnimationFrame;
    window.requestAnimationFrame = function(callback) {
        const res = nativeRAF(callback);
        if (typeof gameActive !== 'undefined' && gameActive) {
            for (let id in players) {
                if (id !== peer.id) drawRemote(players[id]);
            }
        }
        return res;
    };
})();
</script>

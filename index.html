<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>DDNet</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: 'Segoe UI', sans-serif; user-select: none; }
        canvas { display: block; }
        .ui-element { pointer-events: auto; }
        #main-menu { position: absolute; inset: 0; background: rgba(10,10,10,0.98); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: white; }
        .menu-btns { display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .save-container { display: flex; align-items: center; gap: 10px; }
        .save-slot { width: 300px; padding: 20px; background: #222; border: 2px solid #444; border-radius: 12px; cursor: pointer; text-align: center; }
        .save-slot:hover { border-color: #3498db; background: #2a2a2a; }
        .rename-btn { background: #34495e; border: none; color: white; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        #hud { position: absolute; top: 20px; left: 20px; color: white; display: none; pointer-events: none; }
        #hotbar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: none; gap: 10px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 15px; }
        .tool { width: 45px; height: 45px; border-radius: 10px; border: 2px solid #555; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; color: white; }
        .tool.active { border-color: #3498db; background: #3498db; }
        .color-picker { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 12px; color: white; display: flex; flex-direction: column; gap: 10px; }
        input[type="color"] { width: 50px; height: 30px; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div id="main-menu">
    <h1 style="font-size: 48px; margin-bottom: 30px; color: #3498db;">DDNet Web</h1>
    <div class="menu-btns">
        <button class="save-slot" onclick="loadTutorial()" style="background: #27ae60; border-color: #2ecc71;">ТУТОРИАЛ</button>
        <div class="save-container"><div class="save-slot" onclick="loadSlot(0)" id="slot-0">Карта 1</div><button class="rename-btn" onclick="renameSlot(0)">✎</button></div>
        <div class="save-container"><div class="save-slot" onclick="loadSlot(1)" id="slot-1">Карта 2</div><button class="rename-btn" onclick="renameSlot(1)">✎</button></div>
        <div id="mp-ui" style="margin-top:20px; padding:15px; background:#111; border:2px solid #3498db; border-radius:12px; width:300px;">
            <div id="my-id" style="font-size:11px; color:#2ecc71; margin-bottom:10px; cursor:pointer;">Загрузка ID...</div>
            <input type="text" id="join-id" placeholder="ID друга" style="width:80%; padding:5px; margin-bottom:10px;">
            <button onclick="connectToFriend()" style="width:90%; padding:10px; background:#e67e22; color:white; border:none; border-radius:5px; cursor:pointer;">ЗАЙТИ В МИР</button>
        </div>
    </div>
</div>

<div id="hud">
    <div>HP: <span id="hp-val">10</span></div>
    <div>ARMOR: <span id="ar-val">10</span></div>
</div>

<div id="hotbar">
    <div class="tool active" onclick="setTool('move')" title="Движение (M)">🖐️</div>
    <div class="tool" onclick="setTool('wall')" title="Стена (W)">🧱</div>
    <div class="tool" onclick="setTool('unhookable')" title="Не цепляется (U)">🚫</div>
    <div class="tool" onclick="setTool('spawn')" title="Спавн (S)">🚩</div>
    <div class="tool" onclick="setTool('erase')" title="Стереть (E)">🧼</div>
    <div style="width:2px; background:#555; margin:0 5px;"></div>
    <button onclick="saveCurrentMap()" style="background:#27ae60; border:none; color:white; padding:5px 15px; border-radius:8px; cursor:pointer;">СОХРАНИТЬ</button>
    <button onclick="location.reload()" style="background:#e74c3c; border:none; color:white; padding:5px 15px; border-radius:8px; cursor:pointer;">В МЕНЮ</button>
</div>

<div class="color-picker">
    <label>Тело: <input type="color" id="bodyColor" value="#ffffff"></label>
    <label>Ноги: <input type="color" id="feetColor" value="#ffffff"></label>
</div>

<canvas id="gameCanvas"></canvas>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const TEE_W = 32, TEE_H = 32, TILE_SIZE = 32;

let gameActive = false;
let isTutorial = false;
let currentSlot = 0;
let currentTool = 'move';
let map = { blocks: [], spawn: {x: 100, y: 100} };

const tee = {
    x: 100, y: 100, vx: 0, vy: 0,
    grounded: false,
    jumpPhase: 0,
    hook: { active: false, x: 0, y: 0, targetX: 0, targetY: 0, length: 0 }
};

const camera = { x: 0, y: 0 };
const keys = {};

// --- СЕТЕВАЯ ЧАСТЬ ---
const peer = new Peer();
let players = {};
let conns = [];
let myPeerId = null;

peer.on('open', id => { 
    myPeerId = id; 
    document.getElementById('my-id').innerText = "Твой ID (жми чтобы копировать): " + id;
    document.getElementById('my-id').onclick = () => {
        navigator.clipboard.writeText(id);
        alert("ID скопирован!");
    }
});

function connectToFriend() {
    const id = document.getElementById('join-id').value.trim();
    if(id) setupConn(peer.connect(id, {reliable: true}), false);
}

peer.on('connection', c => setupConn(c, true));

function setupConn(conn, isHost) {
    conn.on('open', () => {
        conns.push(conn);
        if(isHost) {
            // Хост отправляет карту гостю
            conn.send({ type: 'init_map', map: map });
        }
        
        // Цикл синхронизации позиции
        setInterval(() => {
            if(gameActive && conn.open) {
                conn.send({
                    type: 'pos',
                    id: myPeerId,
                    x: tee.x, y: tee.y,
                    hx: tee.hook.x, hy: tee.hook.y, ha: tee.hook.active,
                    bc: document.getElementById('bodyColor').value,
                    fc: document.getElementById('feetColor').value
                });
            }
        }, 30);
    });

    conn.on('data', data => {
        if(data.type === 'init_map') {
            map = data.map;
            gameActive = true;
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('hotbar').style.display = 'none'; // У гостя нет редактора
            tee.x = map.spawn.x; tee.y = map.spawn.y;
        }
        if(data.type === 'pos') {
            players[data.id] = data;
            if(isHost) { // Хост рассылает всем
                conns.forEach(c => { if(c !== conn) c.send(data); });
            }
        }
    });
}

// --- ОСНОВНАЯ ЛОГИКА ИГРЫ ---

window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

function loadSlot(idx) {
    currentSlot = idx;
    const saved = localStorage.getItem('ddnet_save_' + idx);
    if(saved) map = JSON.parse(saved);
    else map = { blocks: [], spawn: {x: 100, y: 100} };
    startGame();
}

function loadTutorial() {
    isTutorial = true;
    map = { 
        blocks: [
            {x: 0, y: 200, w: 800, h: 40, type: 'wall'},
            {x: 400, y: 100, w: 40, h: 40, type: 'wall'}
        ], 
        spawn: {x: 50, y: 150} 
    };
    startGame();
}

function startGame() {
    gameActive = true;
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    document.getElementById('hotbar').style.display = 'flex';
    tee.x = map.spawn.x; tee.y = map.spawn.y;
    tee.vx = tee.vy = 0;
}

function update() {
    if(!gameActive) return;

    // Движение
    if(keys['KeyA']) tee.vx -= 0.8;
    if(keys['KeyD']) tee.vx += 0.8;
    
    // Прыжок
    if(keys['Space'] && tee.grounded) {
        tee.vy = -12;
        tee.grounded = false;
    }

    // Физика
    tee.vx *= 0.9;
    tee.vy += 0.5;
    tee.x += tee.vx;
    tee.y += tee.vy;

    // Коллизии с блоками
    tee.grounded = false;
    map.blocks.forEach(b => {
        if(tee.x < b.x + b.w && tee.x + TEE_W > b.x && tee.y < b.y + b.h && tee.y + TEE_H > b.y) {
            if(tee.vy > 0) { tee.y = b.y - TEE_H; tee.vy = 0; tee.grounded = true; }
            else if(tee.vy < 0) { tee.y = b.y + b.h; tee.vy = 0; }
        }
    });

    // Камера
    camera.x += (tee.x - canvas.width/2 - camera.x) * 0.1;
    camera.y += (tee.y - canvas.height/2 - camera.y) * 0.1;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    if(!gameActive) { requestAnimationFrame(draw); return; }

    update();

    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    // Рисуем карту
    map.blocks.forEach(b => {
        ctx.fillStyle = b.type === 'wall' ? '#444' : '#c0392b';
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = '#000'; ctx.strokeRect(b.x, b.y, b.w, b.h);
    });

    // Рисуем других игроков
    for(let id in players) {
        let p = players[id];
        if(p.ha) {
            ctx.strokeStyle = '#fff'; ctx.beginPath();
            ctx.moveTo(p.x+16, p.y+16); ctx.lineTo(p.hx, p.hy); ctx.stroke();
        }
        ctx.fillStyle = p.bc; ctx.beginPath(); ctx.arc(p.x+16, p.y+16, 16, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = p.fc; ctx.fillRect(p.x, p.y+28, 10, 8); ctx.fillRect(p.x+22, p.y+28, 10, 8);
    }

    // Рисуем своего Tee
    ctx.fillStyle = document.getElementById('bodyColor').value;
    ctx.beginPath(); ctx.arc(tee.x+16, tee.y+16, 16, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = document.getElementById('feetColor').value;
    ctx.fillRect(tee.x, tee.y+28, 10, 8); ctx.fillRect(tee.x+22, tee.y+28, 10, 8);

    ctx.restore();
    requestAnimationFrame(draw);
}

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

draw();

function setTool(t) {
    currentTool = t;
    document.querySelectorAll('.tool').forEach(el => el.classList.remove('active'));
    event.currentTarget.classList.add('active');
}

function saveCurrentMap() {
    localStorage.setItem('ddnet_save_' + currentSlot, JSON.stringify(map));
    alert("Сохранено!");
}

function renameSlot(idx) {
    const name = prompt("Назови карту:");
    if(name) document.getElementById('slot-' + idx).innerText = name;
}
</script>
</body>
</html>
